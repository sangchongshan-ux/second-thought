<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8a97"/></marker></defs><rect width="1020" height="500" fill="#ffffff"/><text x="30" y="34" font-size="21" font-weight="700" fill="#17232e">Storyboard 3 — Ending, and taking the data back</text><text x="30" y="54" font-size="14" fill="#7b8a97">The summary is where a study instrument usually over-claims. Here the limits sit in the same card as the numbers.</text><rect x="30" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="30" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="30" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="314" cy="91" r="9" fill="#2c5f80"/><text x="314" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="44" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">SUMMARY</text><rect x="44" y="128" width="262" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="168" width="272" height="46" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="54" y="186" font-size="12" fill="#2c5f80">Solved without help 1/3 · with hints 2/3</text><text x="54" y="200" font-size="12" fill="#2c5f80">Deepest hint level 3 of 3</text><rect x="44" y="224" width="272" height="58" rx="7" fill="#fbf3e2" stroke="#eddfc2"/><text x="54" y="242" font-size="12" fill="#8a6420">Carried by the last step</text><text x="54" y="256" font-size="12" fill="#8a6420">This is not a measure of your ability.</text><text x="54" y="270" font-size="12" fill="#8a6420">It cannot say how you would do tomorrow.</text><path d="M 334 226 L 382 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="30" y="400" font-size="15" font-weight="700" fill="#17232e">1 · The profile, with its limits</text><text x="30" y="419" font-size="13" fill="#4a5a68">Numbers first, then a fixed statement</text><text x="30" y="434" font-size="13" fill="#4a5a68">of what they cannot support.</text><rect x="360" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="360" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="360" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="644" cy="91" r="9" fill="#2c5f80"/><text x="644" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="374" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">SUMMARY · DETAIL</text><rect x="374" y="128" width="212" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="145" width="242" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="162" width="192" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="226" width="272" height="54" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="384" y="244" font-size="12" fill="#2c5f80">1  2 attempts  hint 2  38s  with support</text><text x="384" y="258" font-size="12" fill="#2c5f80">2  1 attempt   hint 3  26s  with support</text><text x="384" y="272" font-size="12" fill="#2c5f80">3  2 attempts  none    44s  unaided</text><path d="M 664 226 L 712 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="360" y="400" font-size="15" font-weight="700" fill="#17232e">2 · Checks the record</text><text x="360" y="419" font-size="13" fill="#4a5a68">Per-problem attempts, deepest hint,</text><text x="360" y="434" font-size="13" fill="#4a5a68">time and outcome.</text><rect x="690" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="690" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="690" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="974" cy="91" r="9" fill="#2c5f80"/><text x="974" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="704" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">SUMMARY · DATA</text><rect x="704" y="128" width="232" height="7" rx="3.5" fill="#e7ecf0"/><rect x="704" y="194" width="272" height="74" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="714" y="212" font-size="12" fill="#2c5f80">[ Export session JSON ]</text><text x="714" y="226" font-size="12" fill="#2c5f80">[ Delete this session ]</text><text x="714" y="240" font-size="12" fill="#2c5f80">[ Start a new set ]</text><text x="690" y="400" font-size="15" font-weight="700" fill="#17232e">3 · Exports or deletes</text><text x="690" y="419" font-size="13" fill="#4a5a68">One JSON file, or remove it from</text><text x="690" y="434" font-size="13" fill="#4a5a68">this device. No copy is kept elsewhere.</text></svg>