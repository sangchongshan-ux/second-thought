<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8a97"/></marker></defs><rect width="1020" height="500" fill="#ffffff"/><text x="30" y="34" font-size="21" font-weight="700" fill="#17232e">Storyboard 1 — Stuck, then unstuck</text><text x="30" y="54" font-size="14" fill="#7b8a97">One learner, three frames. The system never states the answer; it names the trap and hands back the next step.</text><rect x="30" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="30" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="30" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="314" cy="91" r="9" fill="#2c5f80"/><text x="314" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="44" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 1</text><rect x="44" y="128" width="232" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="145" width="182" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="162" width="252" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="226" width="272" height="62" rx="7" fill="#fbf3e2" stroke="#eddfc2"/><text x="54" y="244" font-size="12" fill="#8a6420">Not yet. £0.10 is the answer most</text><text x="54" y="258" font-size="12" fill="#8a6420">people give first: the numbers invite</text><text x="54" y="272" font-size="12" fill="#8a6420">a subtraction that is not asked for.</text><path d="M 334 226 L 382 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="30" y="400" font-size="15" font-weight="700" fill="#17232e">1 · The obvious answer</text><text x="30" y="419" font-size="13" fill="#4a5a68">Types £0.10, the answer the item is</text><text x="30" y="434" font-size="13" fill="#4a5a68">built to attract.</text><rect x="360" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="360" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="360" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="644" cy="91" r="9" fill="#2c5f80"/><text x="644" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="374" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 1 · HINT</text><rect x="374" y="128" width="212" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="145" width="242" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="194" width="272" height="76" rx="7" fill="#fbf3e2" stroke="#eddfc2"/><text x="384" y="212" font-size="12" fill="#8a6420">Hint 2 of 3 · strategy</text><text x="384" y="226" font-size="12" fill="#8a6420">Name the ball b. The bat is b + 1.00.</text><text x="384" y="240" font-size="12" fill="#8a6420">Together they make 1.10 — one equation.</text><rect x="374" y="286" width="272" height="40" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="384" y="304" font-size="12" fill="#2c5f80">[ I need more than this ]</text><path d="M 664 226 L 712 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="360" y="400" font-size="15" font-weight="700" fill="#17232e">2 · Asks for the next step</text><text x="360" y="419" font-size="13" fill="#4a5a68">One click. The rule engine picks</text><text x="360" y="434" font-size="13" fill="#4a5a68">level 2 because the lure was hit.</text><rect x="690" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="690" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="690" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="974" cy="91" r="9" fill="#2c5f80"/><text x="974" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="704" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 1 · SOLVED</text><rect x="704" y="128" width="172" height="7" rx="3.5" fill="#e7ecf0"/><rect x="704" y="145" width="202" height="7" rx="3.5" fill="#e7ecf0"/><rect x="704" y="194" width="272" height="54" rx="7" fill="#e9f4ee" stroke="#cfe4d9"/><text x="714" y="212" font-size="12" fill="#2f6b4f">Correct. You got there with hint 2.</text><text x="714" y="226" font-size="12" fill="#2f6b4f">Solved with support · recorded.</text><rect x="704" y="266" width="272" height="74" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="714" y="284" font-size="12" fill="#2c5f80">What made this easier or harder</text><text x="714" y="298" font-size="12" fill="#2c5f80">than it looked?</text><text x="714" y="312" font-size="12" fill="#2c5f80">[ Save and continue ]</text><text x="690" y="400" font-size="15" font-weight="700" fill="#17232e">3 · Finishes it, then reflects</text><text x="690" y="419" font-size="13" fill="#4a5a68">The prompt appears at the boundary,</text><text x="690" y="434" font-size="13" fill="#4a5a68">not while they are still working.</text></svg>