<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="1020" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8a97"/></marker></defs><rect width="1020" height="500" fill="#ffffff"/><text x="30" y="34" font-size="21" font-weight="700" fill="#17232e">Storyboard 2 — Asking for the answer</text><text x="30" y="54" font-size="14" fill="#7b8a97">What happens when the request is "just tell me". The ladder has a floor: level 3 still leaves the last step to the learner.</text><rect x="30" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="30" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="30" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="314" cy="91" r="9" fill="#2c5f80"/><text x="314" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="44" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 2</text><rect x="44" y="128" width="252" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="145" width="202" height="7" rx="3.5" fill="#e7ecf0"/><rect x="44" y="194" width="272" height="58" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="54" y="212" font-size="12" fill="#2c5f80">"just give me the answer"</text><text x="54" y="226" font-size="12" fill="#2c5f80">Type a number — digits only is fine,</text><text x="54" y="240" font-size="12" fill="#2c5f80">units are optional.</text><path d="M 334 226 L 382 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="30" y="400" font-size="15" font-weight="700" fill="#17232e">1 · Tries to get the answer</text><text x="30" y="419" font-size="13" fill="#4a5a68">Types a sentence instead of a value.</text><text x="30" y="434" font-size="13" fill="#4a5a68">The checker only parses a number.</text><rect x="360" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="360" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="360" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="644" cy="91" r="9" fill="#2c5f80"/><text x="644" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="374" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 2 · HINT 3</text><rect x="374" y="128" width="222" height="7" rx="3.5" fill="#e7ecf0"/><rect x="374" y="194" width="272" height="84" rx="7" fill="#fbf3e2" stroke="#eddfc2"/><text x="384" y="212" font-size="12" fill="#8a6420">Hint 3 of 3 · worked step</text><text x="384" y="226" font-size="12" fill="#8a6420">The machines work in parallel. Adding</text><text x="384" y="240" font-size="12" fill="#8a6420">machines raises output per minute; it does</text><text x="384" y="254" font-size="12" fill="#8a6420">not shorten the time one widget takes.</text><rect x="374" y="288" width="272" height="38" rx="7" fill="#eaf1f6" stroke="#cfdfea"/><text x="384" y="306" font-size="12" fill="#2c5f80">[ Hide hint ]</text><path d="M 664 226 L 712 226" stroke="#7b8a97" stroke-width="1.5" marker-end="url(#a2)"/><text x="360" y="400" font-size="15" font-weight="700" fill="#17232e">2 · Reaches the last rung</text><text x="360" y="419" font-size="13" fill="#4a5a68">Level 3 does one step with them</text><text x="360" y="434" font-size="13" fill="#4a5a68">and stops. No answer is produced.</text><rect x="690" y="76" width="300" height="300" rx="12" fill="#ffffff" stroke="#dde4ea" stroke-width="1.4"/><rect x="690" y="76" width="300" height="30" rx="12" fill="#f7f9fa"/><rect x="690" y="94" width="300" height="12" fill="#f7f9fa"/><circle cx="974" cy="91" r="9" fill="#2c5f80"/><text x="974" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="704" y="95" font-size="12.5" letter-spacing="0.8" fill="#7b8a97">PROBLEM 2 · SOLVED</text><rect x="704" y="128" width="192" height="7" rx="3.5" fill="#e7ecf0"/><rect x="704" y="145" width="232" height="7" rx="3.5" fill="#e7ecf0"/><rect x="704" y="194" width="272" height="54" rx="7" fill="#e9f4ee" stroke="#cfe4d9"/><text x="714" y="212" font-size="12" fill="#2f6b4f">Correct. You got there with hint 3.</text><text x="714" y="226" font-size="12" fill="#2f6b4f">Deepest hint level: 3 of 3</text><text x="690" y="400" font-size="15" font-weight="700" fill="#17232e">3 · Still has to commit</text><text x="690" y="419" font-size="13" fill="#4a5a68">They answer 5. The summary will</text><text x="690" y="434" font-size="13" fill="#4a5a68">record the depth they needed.</text></svg>